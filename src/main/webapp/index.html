<!DOCTYPE html>
<html>
<head>

    <title>Login Page</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .login-box {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h2>Login</h2>

    <form action="login" method="post">

        <label>Username:</label>

        <input type="text"
               name="username"
               placeholder="Enter Username"
               required>

        <label>Password:</label>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <input type="submit" value="Login">

    </form>

</div>

</body>
</html>
